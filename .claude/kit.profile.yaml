# kit.profile.yaml — machine-readable rules for this repo.
# Prose guidance lives in CLAUDE.md; values live here. See the kit's
# `profile-contract` skill for what every key means.

project:
  name: orbital-ops
  description: "Real-time satellite + vessel tracker on a CesiumJS globe (orbit.irminsul.uk)"

stack:
  language: typescript
  framework: react-vite

commands:
  build: "npm run build"
  test: "npm test"
  lint: "npm run lint"
  format: ""
  run: "npm run dev"
  check: "npm run lint && npm test" # ~4 s — the Stop gate runs it after source changes

git:
  trunk: main
  branch_prefixes: [feat, fix, chore, docs, refactor]
  can_push: true

pr:
  target: main
  who_merges:
    auto: []
    manual: [low, medium, high] # merging main deploys to the cloud box
  required_checks: []

risk_paths:
  - "apps/web/src/core/engine/**" # Cesium lifecycle — leaks here are invisible until runtime
  - "apps/web/src/workers/**" # SGP4 batch propagation lives here (the earlier **/*sgp4* matched no file)
  - "**/*propagat*" # frame/unit bugs produce plausible wrong answers
  - ".github/workflows/**"
  - "Dockerfile*"
  - "docker-compose*.yml"
  - "**/*.env*"

# Enforced subset of CLAUDE.md's routing table (kit-core guard-skill-routing): the first
# write to a matching path is denied until that skill is loaded, once per session per skill.
# The engine and orbital-mechanics rows in that table point at AGENTS, which a path glob
# cannot dispatch — those stay guidance, and `risk_paths` already gates the engine folder.
skill_routes:
  - glob: 'apps/web/src/features/**'
    skill: frontend-slice-architecture
    why: 'a feature folder holds UI, state and domain logic together'

conventions:
  language: en
  commit_format: "<type>(<scope>): <summary>"
  ai_authorship_trailer: false
  docs_dir: docs

review:
  severity_floor: low

flows:
  plan_gate: false

units:
  kind: vertical-slice
  description: "one feature folder under apps/web/src/features/ — UI, state, and domain logic together"

token_budget: null

# Vendored docs: only sites that publish a real llms-full.txt (verified 2026-09-05); /kit-docs vendors
# these and nothing else unless --all. The site documents its current release — keep majors aligned.
docs:
  url_map:
    hono: "https://hono.dev/llms-full.txt"
    zod: "https://zod.dev/llms-full.txt"
    zustand: "https://zustand.docs.pmnd.rs/llms-full.txt"

second_brain:
  enabled: true
  root: "~/Obsidian/SecondBrain"
# Agent tiering and kill criteria (agentic-repo playbook, 2026-09-04). Gate agents read and
# report on sonnet; build and review agents stay on opus. The same gate failing three times
# for one agent stops the flow and hands the decision over.
model_tiers:
  gate: sonnet
  build: opus
agents:
  max_stuck_iterations: 3


packs:
  frontend_ts:
    enabled: true
    apps_root: "apps"
    framework: react-vite
    data:
      client: manual # no OpenAPI codegen; apps/api is hand-typed via packages/shared
      server_state: none # zustand holds client state; there is no server-state library
    forms: none # no forms in this app
    styling: css-modules # HUD styling is hand-written CSS, not a token framework
    features:
      multi_tenant: false
      i18n: false
    naming:
      slice_parts: [components, state, domain]
    test:
      unit: vitest
      component: none
      mock: none
      e2e: none
    coverage:
      min_line: null
    bundle_budget: null
